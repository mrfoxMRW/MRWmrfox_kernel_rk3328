name: 构建 RK3328 Kernel

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装系统依赖
        run: |
          sudo apt-get -y update
          sudo apt-get install -y sudo curl gzip tar build-essential ncurses-dev libssl-dev bc kmod cpio flex libelf-dev debhelper devscripts

      - name: 安装 FriendlyElec 编译环境
        run: |
          sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh)"

      - name: 配置交叉编译工具链 PATH（全局生效）
        run: |
          echo "/opt/FriendlyARM/toolchain/11.3-aarch64/bin" >> $GITHUB_PATH
          echo "GCC_COLORS=auto" >> $GITHUB_ENV

      - name: 验证 toolchain
        run: aarch64-linux-gcc -v

      - name: 提前下载内核打包工具 mrw-tools
        run: |
          mkdir -p mrw-tools
          wget -P mrw-tools https://raw.githubusercontent.com/friendlyarm/sd-fuse_rk3328/kernel-6.1.y/tools/mkkrnlimg
          wget -P mrw-tools https://raw.githubusercontent.com/friendlyarm/sd-fuse_rk3328/kernel-6.1.y/tools/resource_tool
          wget -P mrw-tools https://raw.githubusercontent.com/friendlyarm/sd-fuse_rk3328/kernel-6.1.y/prebuilt/boot/logo.bmp
          wget -P mrw-tools https://raw.githubusercontent.com/friendlyarm/sd-fuse_rk3328/kernel-6.1.y/prebuilt/boot/logo_kernel.bmp
          chmod +x mrw-tools/mkkrnlimg mrw-tools/resource_tool

      - name: 克隆内核源码
        run: |
          git clone https://github.com/mrfoxMRW/MRWmrfox_kernel_rk3328

      - name: 准备编译环境
        run: |
          cd MRWmrfox_kernel_rk3328
          touch .scmversion
          mkdir -p ../mrw_debs

      - name: 清理 & 编译设备树 dtbs
        run: |
          cd MRWmrfox_kernel_rk3328
          if [ -f .config ]; then
            make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 clean
          fi
          make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 dtbs

      - name: 正式编译内核
        run: |
          cd MRWmrfox_kernel_rk3328
          make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 -j$(nproc)

      - name: 编译 & 处理内核模块
        run: |
          cd MRWmrfox_kernel_rk3328
          mkdir -p out-modules && rm -rf out-modules/*
          make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 INSTALL_MOD_PATH="$PWD/out-modules" modules -j$(nproc)
          make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 INSTALL_MOD_PATH="$PWD/out-modules" modules_install

          KERNEL_VER=$(make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 kernelrelease)
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          [ ! -f "$PWD/out-modules/lib/modules/$KERNEL_VER/modules.dep" ] && depmod -b out-modules -E Module.symvers -F System.map -w $KERNEL_VER
          (cd out-modules && find . -name *.ko | xargs aarch64-linux-strip --strip-unneeded)

      - name: 生成内核 deb 包
        run: |
          cd MRWmrfox_kernel_rk3328
          make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 KDEB_DESTDIR="../mrw_debs" deb-pkg
          ls -lh ../mrw_debs/

      # ==============================================
      # ✅ 修复：打包整个 out-modules，同时避免符号链接循环
      # ==============================================
      - name: 压缩模块为 tar.gz（保留整个 out-modules，避免循环）
        run: |
          cd MRWmrfox_kernel_rk3328
          # --dereference：把符号链接转为实际文件，彻底斩断 build/source 循环
          tar zcvf out-modules.tar.gz --dereference out-modules

      - name: 压缩 deb 目录为 tar.gz
        run: |
          tar zchvf mrw_debs.tar.gz mrw_debs

      - name: 生成 kernel.img
        run: |
          cd MRWmrfox_kernel_rk3328
          ../mrw-tools/mkkrnlimg arch/arm64/boot/Image kernel.img

      - name: 生成 resource.img
        run: |
          cd MRWmrfox_kernel_rk3328
          ../mrw-tools/resource_tool --dtbname arch/arm64/boot/dts/rockchip/rk3328-nanopi*-rev*.dtb ../mrw-tools/logo.bmp ../mrw-tools/logo_kernel.bmp

      - name: 获取构建时间
        id: time
        run: echo "BUILD_TIME=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: 展示所有文件
        run: |
          ls -lh MRWmrfox_kernel_rk3328/*.img
          ls -lh *.tar.gz
          ls -lh MRWmrfox_kernel_rk3328/*.tar.gz

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNEL_VER }}-${{ env.BUILD_TIME }}
          path: |
            MRWmrfox_kernel_rk3328/kernel.img
            MRWmrfox_kernel_rk3328/resource.img
            MRWmrfox_kernel_rk3328/out-modules.tar.gz
            mrw_debs.tar.gz

      - name: 发布 Release（按时间命名）
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-${{ env.KERNEL_VER }}-${{ env.BUILD_TIME }}
          name: Kernel ${{ env.KERNEL_VER }} 构建于 ${{ env.BUILD_TIME }}
          body: |
            自动构建 RK3328 内核
            版本：${{ env.KERNEL_VER }}
            构建时间：${{ env.BUILD_TIME }}
          files: |
            MRWmrfox_kernel_rk3328/kernel.img
            MRWmrfox_kernel_rk3328/resource.img
            MRWmrfox_kernel_rk3328/out-modules.tar.gz
            mrw_debs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
